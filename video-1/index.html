(function () {

  var STORAGE_KEY = "persistent_tracking_params_v1";
  var COOKIE_NAME = "persistent_tracking_params_v1";
  var COOKIE_DAYS = 365;

  function getParams(search) {
    var params = {};
    new URLSearchParams(search || "").forEach(function (value, key) {
      params[key] = value;
    });
    return params;
  }

  function readCookie() {
    var match = document.cookie.match(
      new RegExp("(?:^|; )" + COOKIE_NAME + "=([^;]*)")
    );

    if (!match) return {};

    try {
      return JSON.parse(decodeURIComponent(match[1]));
    } catch (e) {
      return {};
    }
  }

  function loadParams() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}

    return readCookie();
  }

  function saveParams(params) {
    var value = JSON.stringify(params);

    try {
      localStorage.setItem(STORAGE_KEY, value);
    } catch (e) {}

    try {
      document.cookie =
        COOKIE_NAME + "=" + encodeURIComponent(value) +
        "; Max-Age=" + (COOKIE_DAYS * 86400) +
        "; Path=/; SameSite=Lax" +
        (location.protocol === "https:" ? "; Secure" : "");
    } catch (e) {}
  }

  function mergeParams(saved, current) {
    var result = Object.assign({}, saved);

    Object.keys(current).forEach(function (key) {
      if (current[key] !== "") {
        result[key] = current[key];
      }
    });

    return result;
  }

  function getAllParams() {
    var saved = loadParams();
    var current = getParams(location.search);
    var all = mergeParams(saved, current);

    if (Object.keys(all).length) saveParams(all);

    return all;
  }

  function appendParams(urlString) {
    try {
      var url = new URL(urlString, location.href);
      var params = getAllParams();

      Object.keys(params).forEach(function (key) {
        if (!url.searchParams.has(key) || url.searchParams.get(key) === "") {
          url.searchParams.set(key, params[key]);
        }
      });

      return url.href;
    } catch (e) {
      return urlString;
    }
  }

  function updateLinks() {
    document.querySelectorAll("a[href]").forEach(function (link) {
      var href = link.getAttribute("href");

      if (
        !href ||
        href.charAt(0) === "#" ||
        /^(javascript:|mailto:|tel:)/i.test(href)
      ) return;

      link.href = appendParams(link.href);
    });
  }

  function preserveUrl() {
    var params = getAllParams();
    var url = new URL(location.href);
    var changed = false;

    Object.keys(params).forEach(function (key) {
      if (!url.searchParams.has(key) || url.searchParams.get(key) === "") {
        url.searchParams.set(key, params[key]);
        changed = true;
      }
    });

    if (changed) {
      history.replaceState(history.state, "", url.href);
    }
  }

  // Captura os parâmetros assim que o script executa.
  getAllParams();

  // Mantém os parâmetros visíveis na URL atual.
  preserveUrl();

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", updateLinks);
  } else {
    updateLinks();
  }

  // Também trata links adicionados dinamicamente.
  var observer = new MutationObserver(updateLinks);

  function startObserver() {
    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
    updateLinks();
  }

  if (document.body) {
    startObserver();
  } else {
    document.addEventListener("DOMContentLoaded", startObserver);
  }

  // Preserva parâmetros em navegações feitas via History API.
  var originalPushState = history.pushState;

  history.pushState = function () {
    var result = originalPushState.apply(this, arguments);
    preserveUrl();

  };

    return result;
  };

  window.appendTrackingParams = appendParams;
