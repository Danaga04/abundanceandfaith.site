
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07102f">
  <title>Your Message</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #07102f;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 14px 40px;
      text-align: center;
    }

    .video-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    vturb-smartplayer {
      display: block;
      width: 100%;
      margin: 0 auto;
    }

    #esconder {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 28px auto 0;
    }

    .card-title {
      margin: 0 auto 22px;
      color: #ffffff;
      font-size: clamp(21px, 5.5vw, 28px);
      line-height: 1.2;
      font-weight: 800;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      width: 100%;
      margin: 0 auto;
    }

    .card-slot {
      display: block;
      position: relative;
      width: 100%;
      min-width: 0;
      padding: 0;
      aspect-ratio: 0.625;
      border: none;
      background: transparent;
      cursor: pointer;
      perspective: 1000px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(.2, .75, .2, 1);
    }

    .card-slot.revealed .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 2px solid #ff2692;
      border-radius: 10px;
      background: #080b1e;
      box-shadow:
        0 0 7px rgba(255, 38, 146, .8),
        0 0 16px rgba(255, 38, 146, .25);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-face img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .card-front {
      transform: rotateY(180deg);
    }

    .card-slot:not(.revealed):hover .card-face {
      box-shadow:
        0 0 10px rgba(255, 38, 146, 1),
        0 0 23px rgba(255, 38, 146, .45);
    }

    .card-slot:focus-visible .card-face {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }

    .card-slot:disabled {
      cursor: default;
      opacity: 1;
    }

    .continue-button {
      display: block;
      width: 100%;
      max-width: 360px;
      margin: 25px auto 0;
      padding: 17px 24px;
      border: 2px solid #ff2692;
      border-radius: 40px;
      background: #d71c79;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      box-shadow:
        0 0 10px rgba(255, 38, 146, .65),
        0 0 24px rgba(255, 38, 146, .25);
      cursor: pointer;
      animation: fadeUp .5s ease both;
      transition: transform .2s ease, filter .2s ease;
      -webkit-appearance: none;
    }

    .continue-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .continue-button:active {
      transform: scale(.98);
    }

    .continue-button[hidden] {
      display: none !important;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 430px) {
      .page {
        padding: 12px 10px 32px;
      }

      #esconder {
        margin-top: 24px;
      }

      .cards {
        gap: 6px;
      }

      .card-face {
        border-radius: 7px;
        border-width: 1.5px;
      }

      .card-title {
        margin-bottom: 18px;
      }

      .continue-button {
        margin-top: 22px;
      }
    }

    @media (max-width: 340px) {
      .cards {
        gap: 4px;
      }

      .card-face {
        border-radius: 5px;
        border-width: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .card-inner {
        transition-duration: 0.1s;
      }
    }
  </style>
</head>

  <!-- Card selection and automatic scrolling -->
  <script>
    (function () {
      const cards = document.querySelectorAll(".card-slot");
      const continueButton = document.getElementById("continueButton");

      let cardSelected = false;

      cards.forEach(function (card) {
        card.addEventListener("click", function () {
          // Only one card can be selected.
          if (cardSelected) return;

          cardSelected = true;

          // Reveal the selected card.
          card.classList.add("revealed");
          card.setAttribute("aria-pressed", "true");

          // Disable the remaining cards.
          cards.forEach(function (otherCard) {
            otherCard.disabled = true;
          });

          // Show the button after the card animation starts.
          window.setTimeout(function () {
            continueButton.hidden = false;

            // Automatically scroll down to the Continue button.
            window.setTimeout(function () {
              continueButton.scrollIntoView({
                behavior: "smooth",
                block: "center"
              });
            }, 100);

          }, 650);
        });
      });

      // Intentionally no preventDefault:
      // the link navigates directly to /megan2/.
    })();
  </script>
